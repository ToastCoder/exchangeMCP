name = "exchange-mcp"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# D1 database, bound by NAME. There is intentionally no `database_id` here so the
# ID never lands in this public repo: `wrangler deploy` and
# `wrangler d1 migrations apply exchange --remote` look up the database called
# "exchange" in your Cloudflare account and use its ID automatically.
# Create it once with:  npx wrangler d1 create exchange
# (If Wrangler ever writes a database_id back into this file, discard that change.)
[[d1_databases]]
binding = "DB"
database_name = "exchange"
migrations_dir = "migrations"

[vars]
# Max memory body size in bytes (64 KB).
MAX_BODY_BYTES = "65536"

# Secrets (never put them in this file):
#   npx wrangler secret put EXCHANGE_TOKEN
# For local dev, copy .dev.vars.example to .dev.vars.
